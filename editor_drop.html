<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드래그·드롭 편집기 (확실한 방식)</title>
<meta name="color-scheme" content="light dark">
<style>
  :root{--bg:#f6f8fb;--ink:#0b132b;--line:#e5e8ef;--panel:#ffffff;--accent:#1849ab}
  @media (prefers-color-scheme: dark){:root{--bg:#0e1423;--ink:#e6e9f2;--line:#25314a;--panel:#151c2e;--accent:#4d7cff}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Noto Sans KR,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  header{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 12px;z-index:10;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  header .title{font-weight:700}
  .toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button{border:1px solid var(--line);background:var(--panel);padding:10px 12px;border-radius:10px;cursor:pointer}
  button.primary{background:var(--accent);color:#fff;border-color:transparent}
  button:active{opacity:.9}
  input[type="file"]{display:none}
  label.file{border:1px dashed var(--line);padding:10px 12px;border-radius:10px;cursor:pointer}
  main{padding:12px;display:grid;gap:12px}
  .drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;background:var(--panel)}
  .drop.highlight{border-color:var(--accent)}
  .hint{font-size:.9rem;opacity:.85}
  iframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:12px;background:#fff}
</style>
</head>
<body>
<header>
  <span class="title">드래그·드롭 편집기</span>
  <div class="toolbar">
    <label class="file"><input type="file" id="picker" accept=".html,.htm">index.html 선택</label>
    <button id="toggleEdit">편집 켜기</button>
    <button onclick="cmd('bold')"><b>B</b></button>
    <button onclick="cmd('italic')"><i>I</i></button>
    <button onclick="cmd('underline')"><u>U</u></button>
    <button onclick="cmd('insertUnorderedList')">• 목록</button>
    <button onclick="cmd('insertOrderedList')">1. 목록</button>
    <button onclick="mk('h1')">H1</button>
    <button onclick="mk('h2')">H2</button>
    <button onclick="cmd('undo')">↶</button>
    <button onclick="cmd('redo')">↷</button>
    <button class="primary" id="save">index.html 내보내기(편집본)</button>
  </div>
</header>
<main>
  <div class="drop" id="drop">
    <strong>여기에 <u>index.html</u> 파일을 드래그·드롭</strong> 하거나, 위의 <b>index.html 선택</b> 버튼을 누르세요.<br>
    <span class="hint">이 방식은 iPhone/iPad/Windows/맥 모두에서 안정적으로 동작합니다.</span>
  </div>
  <iframe id="frame" title="편집 프리뷰"></iframe>
</main>
<script>
const drop = document.getElementById('drop');
const picker = document.getElementById('picker');
const frame = document.getElementById('frame');
const toggleBtn = document.getElementById('toggleEdit');
const saveBtn = document.getElementById('save');
let editOn = false;

function readFile(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsText(file, 'utf-8');
  });
}

function setPreviewHTML(html){
  frame.srcdoc = html; // same-origin; edit safe
  frame.addEventListener('load', () => {
    enableEdit(true);
  }, {once:true});
}

function enableEdit(on){
  const doc = frame.contentDocument || frame.contentWindow.document;
  if(!doc){ alert('먼저 index.html을 불러오세요.'); return; }
  doc.designMode = on ? 'on' : 'off';
  editOn = on;
  toggleBtn.textContent = on ? '편집 끄기' : '편집 켜기';
}

function cmd(command, value=null){
  const doc = frame.contentDocument || frame.contentWindow.document;
  if(!doc){ return; }
  if(doc.designMode !== 'on'){ enableEdit(true); }
  doc.execCommand(command, false, value);
}

function mk(tag){
  const doc = frame.contentDocument || frame.contentWindow.document;
  if(!doc){ return; }
  if(doc.designMode !== 'on'){ enableEdit(true); }
  doc.execCommand('formatBlock', false, tag);
}

function download(filename, text){
  const blob = new Blob([text], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  a.remove();
}

picker.addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const html = await readFile(file);
  setPreviewHTML(html);
});

['dragenter','dragover'].forEach(ev=> drop.addEventListener(ev, e=>{
  e.preventDefault(); e.stopPropagation(); drop.classList.add('highlight');
}));
['dragleave','drop'].forEach(ev=> drop.addEventListener(ev, e=>{
  e.preventDefault(); e.stopPropagation(); drop.classList.remove('highlight');
}));
drop.addEventListener('drop', async (e)=>{
  const file = e.dataTransfer.files[0];
  if(!file) return;
  const html = await readFile(file);
  setPreviewHTML(html);
});

toggleBtn.addEventListener('click', ()=> enableEdit(!editOn));

saveBtn.addEventListener('click', ()=>{
  const doc = frame.contentDocument || frame.contentWindow.document;
  if(!doc){ alert('먼저 index.html을 불러오세요.'); return; }
  const html = '<!doctype html>\n' + doc.documentElement.outerHTML;
  download('index.html', html);
});
</script>
</body>
</html>
